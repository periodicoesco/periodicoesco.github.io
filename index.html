<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Daneyri Lisset</title>
    <style>
        body {
            background-color: #f4fcf6;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #2e7d32;
            font-size: 3em;
            margin-bottom: 10px;
        }
        .lirio {
            font-size: 5em;
            cursor: pointer;
            animation: flotar 3s ease-in-out infinite;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.1); }
        }
        .mensaje {
            font-size: 1.5em;
            color: #1b5e20;
            max-width: 80%;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease;
        }
        .mostrar {
            opacity: 1;
            transform: translateY(0);
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        button:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body>

    <h1>Para Daneyri Lisset</h1>
    <!-- El emoji más cercano a un lirio blanco que existe. Que use su imaginación. -->
    <div class="lirio" id="flor">💮</div>
    
    <button id="boton">Toca el lirio</button>

    <p class="mensaje" id="texto">
        No hay código en el mundo que pueda programar lo mucho que te amo. Eres el lirio más hermoso de mi vida. 🤍
    </p>

    <script>
        const flor = document.getElementById('flor');
        const boton = document.getElementById('boton');
        const texto = document.getElementById('texto');

        function revelarAmor() {
            texto.classList.add('mostrar');
            boton.style.display = 'none';
        }

        flor.addEventListener('click', revelarAmor);
        boton.addEventListener('click', revelarAmor);
    </script>

</body>
</html>
