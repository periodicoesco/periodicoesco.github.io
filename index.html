<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Daneyri Lissette</title>
    <style>
        body {
            background: url('https://png.pngtree.com/background/20230513/original/pngtree-field-of-white-lilies-in-the-field-picture-image_2504301.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Arial', sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; 
            margin: 0;
            overflow: hidden; 
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        .contenedor {
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            z-index: 10;
            width: 80%; 
            max-width: 500px;
        }
        h1 { 
            font-size: 2.2em; 
            margin-bottom: 10px; 
        }
        .mensaje {
            font-size: 1.2em;
            margin-top: 20px;
            display: none;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }
        button {
            padding: 15px 30px;
            font-size: 1.1em;
            background-color: #ff4081;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
            transition: transform 0.2s;
        }
        button:hover { 
            transform: scale(1.1); 
            background-color: #e91e63;
        }
        .flor-flotante {
            position: absolute;
            font-size: 2.5em;
            animation: subir 4s linear forwards;
            pointer-events: none;
            z-index: 5;
        }
        @keyframes subir {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Para mi hermosa Daneyri Lissette</h1>
        <button id="boton">Toca para tu sorpresa</button>
        <p class="mensaje" id="texto">
            Ni todos los campos de lirios del mundo se comparan con tu belleza. Te amo. ❤️<br><br>
            <small style="font-size: 0.7em; color: #ddd;">(Toca la pantalla)</small>
        </p>
    </div>

    <script>
        const boton = document.getElementById('boton');
        const texto = document.getElementById('texto');

        boton.addEventListener('click', (e) => {
            e.stopPropagation();
            texto.style.display = 'block';
            boton.style.display = 'none';
            crearLirio(e.clientX, e.clientY);
        });

        window.addEventListener('click', (e) => {
            crearLirio(e.clientX, e.clientY);
        });

        window.addEventListener('touchstart', (e) => {
            const toque = e.touches[0];
            crearLirio(toque.clientX, toque.clientY);
        });

        function crearLirio(x, y) {
            const flor = document.createElement('div');
            flor.classList.add('flor-flotante');
            flor.textContent = '🪷'; 
            
            flor.style.left = (x - 20) + 'px';
            flor.style.top = (y - 20) + 'px';
            
            const tamanoAleatorio = Math.random() * (3 - 1.5) + 1.5;
            flor.style.fontSize = tamanoAleatorio + 'em';

            document.body.appendChild(flor);
            
            setTimeout(() => {
                flor.remove();
            }, 4000);
        }
    </script>

</body>
</html>
